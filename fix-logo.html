<!DOCTYPE html>
<html>
<head><title>Bantu Perbaiki Logo</title></head>
<body>
  <h2>Sedang mengonversi Logo.png jadi persegi 1:1...</h2>
  <script>
    const img = new Image();
    img.src = "icon/Logo.png";
    img.onload = () => {
      const size = Math.max(img.width, img.height); // 594
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      
      // Biarkan background transparan (default context transparan)
      
      // Hitung posisi tengah
      const x = (size - img.width) / 2;
      const y = (size - img.height) / 2;
      
      ctx.drawImage(img, x, y);
      
      // Unduh hasil gambar secara otomatis
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "Logo-Square.png";
      document.body.appendChild(a);
      a.click();
      
      document.body.innerHTML += "<p style='color:green'><b>Berhasil!</b> 1. Silakan ganti `/icon/Logo.png` dengan <b>Logo-Square.png</b> yang baru di-download.<br>2. Hapus file `fix-logo.html` ini jika sudah selesai.</p>";
    };
  </script>
</body>
</html>
